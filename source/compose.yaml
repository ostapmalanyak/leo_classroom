# LEO Classroom deployment stack (Podman / docker-compose).
#
# Only `caddy` publishes host ports; every other service is reachable solely on the internal
# `leo` network. No SSH endpoint is exposed anywhere (git is HTTPS-only). Long-lived services
# carry healthchecks + restart policies. Startup order is enforced via healthcheck dependencies:
#   databases (healthy) -> migrator (exit 0) -> forgejo + backend -> frontend + caddy ; backup runs on its own cron.
#
# Tier-1 secrets are external Podman secrets created by ./init-secrets.sh and mounted at /run/secrets
# (backend via KeyPerFile, Forgejo via FORGEJO__*__FILE). Non-secret config comes from .env (see .env.example).
# Containers avoid compose-only constructs so `podman generate systemd` / Quadlet works later.

services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    # The ONLY service that publishes host ports.
    ports:
      - "80:80"
      - "443:443"
      # Forgejo needs an entry point of its own. With a hostname that would be a second name on 443; with
      # only an IP there is no second name, so it gets a port.
      - "${FORGEJO_PORT}:${FORGEJO_PORT}"
    environment:
      # Defaults matter: an unset variable would leave the Caddyfile with a bare `{`, which Caddy reads as a
      # global options block and refuses to start on. A .env written before these were introduced still works.
      APP_SITE: ${APP_SITE:-:80}
      FORGEJO_SITE: ${FORGEJO_SITE:-:3000}
      # empty would leave the global block's `email` directive without an argument, which Caddy
      # rejects. Unused unless a site address uses https.
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
      TZ: ${TZ}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ${TLS_CERT_DIR:-./certs}:/etc/caddy/certs:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks: [leo]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      forgejo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    # The SPA reads these at startup from /config.json, which the container writes on boot - so one built
    # image works for every environment and a hostname change needs no rebuild.
    environment:
      TZ: ${TZ}
      APP_DOMAIN: ${APP_DOMAIN}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID}
      KEYCLOAK_FLOW: ${KEYCLOAK_FLOW}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-360}
    networks: [leo]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Non-secret application settings arrive as environment variables; ASP.NET maps `__` to a config section
    # separator, so these override the placeholder values baked into appsettings.json.
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      TZ: ${TZ}
      # Public origin of the SPA: the CORS allow-list, and the accept links mailed to students.
      General__ClientOrigin: ${PUBLIC_SCHEME}://${APP_DOMAIN}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Keycloak__Audience: ${KEYCLOAK_AUDIENCE}
      Keycloak__ValidateAudience: ${KEYCLOAK_VALIDATE_AUDIENCE}
      # comma-free list form: Keycloak__AdminUsers__0, __1, ... See .env.
      Keycloak__AdminUsers__0: ${ADMIN_USER_0}
      Keycloak__AdminUsers__1: ${ADMIN_USER_1}
      Keycloak__AdminUsers__2: ${ADMIN_USER_2}
      # Forgejo's REST API over the internal network - no public DNS or certificate needed for it. The clone
      # URLs students receive are generated by Forgejo from its own ROOT_URL, so they stay public.
      Forgejo__BaseUrl: http://forgejo:3000
      Forgejo__BotName: ${FORGEJO_BOT_NAME}
      Forgejo__BotEmail: ${FORGEJO_BOT_EMAIL}
      # Where Forgejo posts its events; also internal, so webhooks never leave the host.
      Forgejo__WebhookTargetUrl: http://backend:8080/api/webhooks/forgejo
      # Id of the Keycloak OAuth2 source inside Forgejo; see DEPLOY.md step 7. 0 until it exists.
      Forgejo__AuthSourceId: ${FORGEJO_AUTH_SOURCE_ID}
      Ldap__Host: ${LDAP_HOST}
      Ldap__Port: ${LDAP_PORT}
      Ldap__TlsMode: ${LDAP_TLS_MODE}
      Ldap__BindDn: ${LDAP_BIND_DN}
      Ldap__StudentBaseDn: ${LDAP_STUDENT_BASE_DN}
      Ldap__TeacherBaseDn: ${LDAP_TEACHER_BASE_DN}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Security: ${SMTP_SECURITY}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__AppBaseUrl: ${PUBLIC_SCHEME}://${APP_DOMAIN}
      Moodle__AppBaseUrl: ${PUBLIC_SCHEME}://${APP_DOMAIN}
      Download__ArtifactStoragePath: /var/lib/leo-classroom/downloads
    volumes:
      # "Download all submissions" artifacts. Without this they live in the container's writable layer and
      # vanish on every recreate, while the job rows still claim they are ready.
      - backend_downloads:/var/lib/leo-classroom/downloads
      # Serilog's rolling log files. A bind mount rather than a named volume on purpose: the point is to
      # read them from the host with `tail -f logs/leoclassroom-*.log`, and a rootless named volume puts
      # them behind `podman unshare`. The container runs as root, which rootless podman maps to the
      # invoking user, so the files land owned by whoever runs `podman compose`.
      - ./logs:/var/log/leo-classroom:z
    secrets:
      - ConnectionStrings__Postgres
      - Forgejo__AdminToken
      - Forgejo__WebhookSecret
      - Ldap__BindPassword
      - Smtp__Password
      - DataProtection__MasterKey
    networks: [leo]
    depends_on:
      migrator:
        condition: service_completed_successfully
      forgejo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: ./backend
      dockerfile: migrator.Dockerfile
    # Short-lived: applies the EF bundle to completion and exits 0. Not restarted.
    restart: "no"
    environment:
      TZ: ${TZ}
    secrets:
      - ConnectionStrings__Postgres
    networks: [leo]
    depends_on:
      backend-db:
        condition: service_healthy

  backend-db:
    # PostgreSQL 18. Note the volume target below: from 18 on, the official image's PGDATA is
    # /var/lib/postgresql/<major>/docker and the declared VOLUME is /var/lib/postgresql, so a mount aimed at
    # the old /var/lib/postgresql/data is silently ignored and the data ends up in an anonymous volume.
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BACKEND_DB_NAME}
      POSTGRES_USER: ${BACKEND_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/backend_db_password
      TZ: ${TZ}
    secrets:
      - backend_db_password
    volumes:
      - backend_db_data:/var/lib/postgresql
    networks: [leo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_DB_USER} -d ${BACKEND_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  forgejo:
    # v15 is the current LTS (supported to 2027-07-15). Deliberately not v16: the quarterly stable releases
    # are supported for three months only, and v11 - what this used to pin - has been end-of-life since
    # 2026-07-16. The major tag tracks patch releases; `podman compose pull forgejo` picks them up.
    image: codeberg.org/forgejo/forgejo:15
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      USER_UID: "1000"
      USER_GID: "1000"
      # HTTPS-only git: no built-in SSH server, no SSH port.
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__ROOT_URL: ${PUBLIC_SCHEME}://${FORGEJO_DOMAIN}/
      FORGEJO__server__DOMAIN: ${FORGEJO_HOST}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: ${FORGEJO_DB_NAME}
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD__FILE: /run/secrets/forgejo_db_password
      # Confidential OIDC client secret for Keycloak SSO (consumed by `forgejo admin auth add-oauth`).
      FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES: "openid email profile"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
    secrets:
      - forgejo_db_password
      - Keycloak__ForgejoClientSecret
    volumes:
      - forgejo_data:/data
    networks: [leo]
    depends_on:
      forgejo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  forgejo-db:
    # PostgreSQL 18; Forgejo supports >= 14. Same volume-target note as backend-db.
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FORGEJO_DB_NAME}
      POSTGRES_USER: ${FORGEJO_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/forgejo_db_password
      TZ: ${TZ}
    secrets:
      - forgejo_db_password
    volumes:
      - forgejo_db_data:/var/lib/postgresql
    networks: [leo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORGEJO_DB_USER} -d ${FORGEJO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    build:
      context: ./backup
    restart: unless-stopped
    # Independent failure domain: its own internal cron (see backup/entrypoint.sh), not tied to the backend.
    environment:
      TZ: ${TZ}
      BACKUP_CRON: ${BACKUP_CRON}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_RETENTION: ${RESTIC_RETENTION}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME}
      BACKEND_DB_USER: ${BACKEND_DB_USER}
      FORGEJO_DB_NAME: ${FORGEJO_DB_NAME}
      FORGEJO_DB_USER: ${FORGEJO_DB_USER}
    secrets:
      - backend_db_password
      - forgejo_db_password
      - restic_password
      - backup_offsite_credentials
    volumes:
      - forgejo_data:/forgejo-data:ro
    networks: [leo]
    depends_on:
      backend-db:
        condition: service_healthy
      forgejo-db:
        condition: service_healthy

networks:
  leo:
    driver: bridge
  # Reserved, isolated segment for the future automated test-runner (§16). No service attaches to it yet.
  test-runner:
    driver: bridge

volumes:
  # The three volumes holding data that cannot be rebuilt are `external: true`: compose neither creates nor
  # removes them, so `podman compose down -v` - and a mistyped project name - cannot take the databases or
  # the Forgejo repositories with it. Compose refuses to start when one is missing, which is a loud failure
  # instead of a silent empty database. Create them once with `podman volume create` (DEPLOY.md step 3b).
  #
  # `name:` is explicit because compose otherwise prefixes a volume with its project name, which it derives
  # from the directory it runs in - so renaming ~/leoclassrooms would silently point the stack at new,
  # empty volumes. The default matches the names an existing deployment already has; VOLUME_PREFIX in .env
  # covers a deployment whose project name differs (check with `podman volume ls`).
  #
  # Unlike the `external: true` *secrets* that podman compose rejects as Swarm-only (see below), external
  # volumes are plain Compose spec and work here.
  forgejo_data:
    external: true
    name: ${VOLUME_PREFIX:-leoclassrooms}_forgejo_data
  forgejo_db_data:
    external: true
    name: ${VOLUME_PREFIX:-leoclassrooms}_forgejo_db_data
  backend_db_data:
    external: true
    name: ${VOLUME_PREFIX:-leoclassrooms}_backend_db_data
  # Empty while this deployment is on plain HTTP, but it holds the ACME account key and issued certificates
  # the moment it has a hostname, and Let's Encrypt rate-limits re-issuance. External now, so that switching
  # PUBLIC_SCHEME later is a one-line change and not a thing to remember.
  caddy_data:
    external: true
    name: ${VOLUME_PREFIX:-leoclassrooms}_caddy_data

  # Compose-managed: everything in these is rebuilt or re-fetched on its own.
  #   caddy_config       Caddy's autosaved config.
  #   backend_downloads  "Download all submissions" artifacts, TTL 24h.
  caddy_config:
  backend_downloads:

# Tier-1 secrets are files in the git-ignored ./secrets directory, created by ./init-secrets.sh and mounted
# read-only at /run/secrets. They are deliberately NOT `external: true` podman/swarm secrets: `external`
# secrets are a Docker Swarm feature, and plain `docker compose` - which `podman compose` delegates to on
# most hosts - rejects them with "unsupported external secret".
secrets:
  ConnectionStrings__Postgres:
    file: ./secrets/ConnectionStrings__Postgres
  Forgejo__AdminToken:
    file: ./secrets/Forgejo__AdminToken
  Forgejo__WebhookSecret:
    file: ./secrets/Forgejo__WebhookSecret
  Ldap__BindPassword:
    file: ./secrets/Ldap__BindPassword
  Smtp__Password:
    file: ./secrets/Smtp__Password
  DataProtection__MasterKey:
    file: ./secrets/DataProtection__MasterKey
  Keycloak__ForgejoClientSecret:
    file: ./secrets/Keycloak__ForgejoClientSecret
  backend_db_password:
    file: ./secrets/backend_db_password
  forgejo_db_password:
    file: ./secrets/forgejo_db_password
  restic_password:
    file: ./secrets/restic_password
  backup_offsite_credentials:
    file: ./secrets/backup_offsite_credentials

<div class="delete-dialog">
  <h2 mat-dialog-title id="delete-course-title">Delete course?</h2>
  <mat-dialog-content>
    <p>This will permanently delete "{{ data.title }}". This cannot be undone.</p>
    <p>Its assignments and associated student repositories will also be removed; the course's Forgejo organization will be deleted when cleanup succeeds.</p>
    @if (error()) {
      <p class="delete-dialog__error" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="deleting()" (click)="close()">Cancel</button>
    <button mat-flat-button class="delete-dialog__confirm" type="button" [disabled]="deleting()" (click)="delete()">
      @if (deleting()) {
        <mat-progress-spinner mode="indeterminate" diameter="18"></mat-progress-spinner>
      } @else {
        Delete
      }
    </button>
  </mat-dialog-actions>
</div>

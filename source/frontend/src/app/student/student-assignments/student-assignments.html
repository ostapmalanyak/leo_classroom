<h1>My classes</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
} @else if (courses().length === 0) {
  <p class="empty">You have no assignments yet.</p>
}

<div class="tiles">
  @for (course of courses(); track course.id) {
    <a class="tile" [routerLink]="['/my-assignments/course', course.id]">
      <span class="tile__badge" [style.background]="course.color">{{ course.initials }}</span>
      <span class="tile__body">
        <span class="tile__title">{{ course.title }}</span>
        <span class="tile__meta">
          @if (course.open > 0) {
            {{ course.open }} open
          } @else {
            All caught up
          }
        </span>
      </span>
    </a>
  }
</div>

<h1>Administration</h1>

<div class="cards">
  @for (link of links; track link.route) {
    <a class="card-link" [routerLink]="link.route">
      <mat-card>
        <mat-card-content>
          <mat-icon>{{ link.icon }}</mat-icon>
          <span class="title">{{ link.title }}</span>
          <span class="description">{{ link.description }}</span>
        </mat-card-content>
      </mat-card>
    </a>
  }
</div>

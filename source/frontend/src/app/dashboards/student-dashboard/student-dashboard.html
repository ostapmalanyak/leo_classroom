<mat-card class="welcome-card">
  <mat-card-content>
    <h1>Welcome</h1>

    <p>
      Log in to
      <a [href]="forgejoLoginUrl" target="_blank" rel="noopener">Forgejo</a>
      to access your repositories.
    </p>

    <p>
      Your Forgejo username and password are available in your My Account tab.
    </p>

    <a mat-flat-button color="primary" routerLink="/account">My Account</a>

    <p>Accept an assignment, follow the Forgejo link it generates and you're good to go.</p>
  </mat-card-content>
</mat-card>

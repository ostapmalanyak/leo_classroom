@if (hidden()) {
  <!-- The notice is out of the way, but not gone: the chip brings it back. -->
  <div class="notice-row">
    <button class="notice-chip" type="button" (click)="show()" aria-label="Show the git login notice">
      <mat-icon aria-hidden="true">warning</mat-icon>
      <span>Git login notice</span>
    </button>
  </div>
} @else {
  <section class="git-warning" role="alert" aria-labelledby="git-warning-title">
    <mat-icon class="git-warning__icon" aria-label="Warning" role="img">warning</mat-icon>

    <div class="git-warning__body">
      <h2 id="git-warning-title">Git asks for a username and password?</h2>
      <p>
        When you push or clone, use the credentials from Generate git password on this page.
        It is gonna be automatic in the future.
      </p>

      <div class="git-warning__actions">
        <!-- The account page owns the action, so the banner points at it instead of
             keeping a second copy of the password logic. -->
        <a class="btn" routerLink="/account">Generate git password</a>
        <button class="btn" type="button" (click)="hide()">
          <mat-icon aria-hidden="true">close</mat-icon>
          <span>Hide</span>
        </button>
      </div>
    </div>
  </section>
}

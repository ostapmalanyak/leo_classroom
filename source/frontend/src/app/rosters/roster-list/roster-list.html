<h1>Rosters</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<table mat-table [dataSource]="rosters()" class="roster-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let roster">{{ roster.name }}</td>
  </ng-container>

  <ng-container matColumnDef="kind">
    <th mat-header-cell *matHeaderCellDef>Kind</th>
    <td mat-cell *matCellDef="let roster">
      @if (roster.kind === RosterKind.Auto) {
        <mat-icon title="Synced automatically">sync</mat-icon>
      } @else {
        <mat-icon title="Custom">groups</mat-icon>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="memberCount">
    <th mat-header-cell *matHeaderCellDef>Members</th>
    <td mat-cell *matCellDef="let roster">{{ roster.memberCount }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"
      (click)="handleRowClicked(row)"
      [class.roster-row]="row.kind === RosterKind.Custom"></tr>
</table>

@if (!loading() && rosters().length === 0) {
  <p class="empty">No rosters yet.</p>
}

@if (session.isTeacher()) {
<section class="create-roster">
  <h2>New custom roster</h2>
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input matInput [ngModel]="newName()" (ngModelChange)="newName.set($event)">
  </mat-form-field>
  <button mat-flat-button color="primary" [disabled]="creating()" (click)="handleCreateClicked()">Create</button>
</section>
}
